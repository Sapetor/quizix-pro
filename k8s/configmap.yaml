apiVersion: v1
kind: ConfigMap
metadata:
  name: quizix-config
  namespace: quizix
  labels:
    app: quizix-pro
data:
  # Application configuration
  NODE_ENV: "production"
  PORT: "3000"

  # Optional: Override network IP detection
  # NETWORK_IP: "your-cluster-ip"

  # BASE_PATH must match the ingress path prefix in 02-quizix-ingress.yaml.
  # Set explicitly (the server's built-in production default is a legacy value).
  BASE_PATH: "/quizix/"
