apiVersion: v1
kind: Namespace
metadata:
  name: quizix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizix-config
  namespace: quizix
data:
  NODE_ENV: "production"
  PORT: "3000"
  # BASE_PATH must match the ingress path prefix in 02-quizix-ingress.yaml.
  # Set explicitly (the server's built-in production default is a legacy value).
  BASE_PATH: "/quizix/"

  # MUST BE SET for correct per-IP rate limiting.
  # middleware/client-ip.js only honours the CF-Connecting-IP header when the
  # TCP peer is loopback or listed here. Behind 02-quizix-ingress.yaml the peer
  # is the ingress-nginx pod, so while this is empty every request resolves to
  # the same req.ip and all per-IP rate limits share one bucket.
  # Set it to the ingress controller pod address(es), comma-separated:
  #   kubectl get pods -n ingress-nginx -l app.kubernetes.io/component=controller \
  #     -o jsonpath='{range .items[*]}{.status.podIP}{","}{end}'
  # Pod IPs change on restart, so prefer a stable value if your CNI allows it.
  TRUSTED_PROXY_IPS: ""

  # MUST BE SET for the join QR code to be scannable.
  # services/qr-service.js:217 uses this verbatim; without it the QR falls back
  # to the container's detected pod IP, which is unroutable outside the cluster.
  # Origin ONLY (scheme + host [+ port]); BASE_PATH is appended, so do not
  # include /quizix here. Example: http://10.80.21.11 or https://quiz.example.com
  PUBLIC_ORIGIN: ""

  # If PUBLIC_ORIGIN is set, list the same origin(s) here or Socket.IO's CORS
  # check rejects the connection. Setting this drops the built-in wildcards.
  # ALLOWED_ORIGINS: "https://quiz.example.com"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quizix-quizzes
  namespace: quizix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quizix-results
  namespace: quizix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quizix-uploads
  namespace: quizix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quizix-pro
  namespace: quizix
spec:
  selector:
    app: quizix-pro
  # Session affinity is critical for Socket.IO sticky sessions
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizix-pro
  namespace: quizix
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  # Use Recreate strategy with RWO volumes to avoid Multi-Attach errors
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: quizix-pro }
  template:
    metadata:
      labels: { app: quizix-pro }
    spec:
      # Pin to a specific node - eliminates Multi-Attach errors with RWO volumes
      # Run: kubectl get nodes -l kubernetes.io/hostname -o name
      # Pick a worker node with adequate disk space
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-node2

      # Give time for graceful shutdown and volume detachment
      terminationGracePeriodSeconds: 60

      # Run as the image's non-root user. Dockerfile and Dockerfile.slim both
      # create it with `addgroup -g 1001 -S nodejs && adduser -S nodejs -u 1001`
      # and chown the data directories to nodejs:nodejs, so uid and gid are 1001.
      # fsGroup makes a freshly provisioned PVC group-writable for that uid;
      # OnRootMismatch skips the recursive relabel when the volume root already
      # matches, which keeps restarts fast on the 5Gi uploads volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

      # Uncomment if your Docker Hub repo is private
      # imagePullSecrets:
      #   - name: dockerhub-cred

      # Init container to ensure directories exist
      initContainers:
        - name: init-dirs
          image: gcr.io/google-containers/busybox:1.27
          # Mount paths here must match the app container's below, so the
          # chown lands on the directory the app actually writes.
          command: ['sh', '-c', 'mkdir -p /app/quizzes /app/results /app/public/uploads && chown -R 1001:1001 /app/quizzes /app/results /app/public/uploads && chmod -R 755 /app/quizzes /app/results /app/public/uploads']
          # chown/chmod on files it does not own needs uid 0 plus CHOWN and
          # FOWNER, so this container overrides the pod-level runAsNonRoot.
          # If the cluster enforces the restricted Pod Security Standard it will
          # reject a uid-0 container: delete this init container and rely on
          # fsGroup instead, which works on CSI drivers that honour it.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: quizzes
              mountPath: /app/quizzes
            - name: results
              mountPath: /app/results
            - name: uploads
              mountPath: /app/public/uploads

      containers:
        - name: quizix-pro
          image: ghcr.io/sapetor/quizix-pro:latest
          imagePullPolicy: Always

          # Every path the server writes is a mount, so /app itself can be
          # read-only:
          #   /app/quizzes       quiz JSON, quiz-metadata.json, users.json,
          #                      quizzes/.session-secret (session-service.js:38)
          #   /app/results       results JSON (game.js:759,793)
          #   /app/public/uploads multer images (file-uploads.js:97), the sharp
          #                      WebP copy, Manim MP4 output
          #   /tmp               os.tmpdir(), used by the mkdtemp() render dir in
          #                      manim-render-service.js and by libvips scratch
          # atomic-write.js writes its temp file next to the destination, so it
          # stays inside the PVCs. server.js mkdir()s those three paths at
          # startup; mkdir on an existing directory returns EEXIST rather than
          # EROFS, and Node's recursive mkdir treats that as success.
          # If you enable Manim (MANIM_ENABLED=true with the full Dockerfile
          # image), re-check this: Manim and its Python dependencies also write
          # to HOME and to font caches, which no mount covers.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          envFrom:
            - configMapRef:
                name: quizix-config

          ports:
            - containerPort: 3000

          # Resource requests/limits - prevents BestEffort QoS (first to evict)
          # Higher ephemeral-storage request = evicted later during disk pressure
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "1Gi"

          # Liveness probe - restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness probe - don't send traffic until ready
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: quizzes
              mountPath: /app/quizzes
            - name: results
              mountPath: /app/results
            - name: uploads
              mountPath: /app/public/uploads
            - name: tmp
              mountPath: /tmp

      volumes:
        # Writable /tmp for the read-only root filesystem above. The size cap
        # stays under the pod's 1Gi ephemeral-storage limit, which emptyDir
        # usage counts against.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: quizzes
          persistentVolumeClaim:
            claimName: quizix-quizzes
        - name: results
          persistentVolumeClaim:
            claimName: quizix-results
        - name: uploads
          persistentVolumeClaim:
            claimName: quizix-uploads
---
# PodDisruptionBudget - protects against voluntary evictions (node drain, upgrades)
# Note: Does NOT protect against disk pressure evictions (those are involuntary)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quizix-pdb
  namespace: quizix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quizix-pro
