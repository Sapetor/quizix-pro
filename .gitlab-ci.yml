# GitLab CI/CD Pipeline for Quizix Pro
# Builds and deploys the container automatically

stages:
  - test
  - build
  - deploy

variables:
  # Use GitLab's built-in Docker registry
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  
# Run lint + unit tests before building the image
test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    # git is needed by npm ci for any git-based deps and by the build tooling
    - apk add --no-cache git
    - npm ci
  script:
    - npm run lint
    - npm test
    # The bundle is committed (Docker rebuilds it, but local serves use the
    # committed copy) — fail if source CSS changed without a rebuild
    - npm run build:css
    - git diff --exit-code public/css/main.bundle.css
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID  # Also validate merge requests
  tags:
    - docker  # Same runner as build/deploy

# Build the Docker image
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # Login to GitLab container registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the image
    - docker build -t $CONTAINER_IMAGE -t $LATEST_IMAGE .
    # Push to registry
    - docker push $CONTAINER_IMAGE
    - docker push $LATEST_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"  # Only build on main branch
    - if: $CI_COMMIT_BRANCH == "master"  # Or master branch

# Deploy the application
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl docker-cli
  script:
    # Stop existing container
    - docker stop quizix-pro-app || true
    - docker rm quizix-pro-app || true
    
    # Create the data directories BEFORE mounting them. They must be owned by
    # uid/gid 1001 (the `nodejs` user the image runs as, Dockerfile:39-40,67) or
    # the app cannot write quizzes, results or uploads into the bind mounts.
    - mkdir -p /opt/quizix-data/quizzes /opt/quizix-data/results /opt/quizix-data/uploads
    - chown -R 1001:1001 /opt/quizix-data

    # Run new container.
    # Mount paths must match where the app actually writes:
    #   /app/quizzes      quiz library + users.json + .session-secret
    #   /app/results      saved game results
    #   /app/public/uploads  uploaded images (NOT /app/uploads)
    - |
      docker run -d \
        --name quizix-pro-app \
        --restart unless-stopped \
        -p 3000:3000 \
        -e NODE_ENV=production \
        -e BASE_PATH=/ \
        -v /opt/quizix-data/quizzes:/app/quizzes \
        -v /opt/quizix-data/results:/app/results \
        -v /opt/quizix-data/uploads:/app/public/uploads \
        $LATEST_IMAGE
    
    # Wait for application to start
    - sleep 10
    
    # Test deployment
    - curl -f http://localhost:3000/health || echo "Health check failed"
    
    # Show deployment info
    - echo "Quizix Pro deployed successfully!"
    - echo "Access at http://10.80.21.11:3000"
    
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
  tags:
    - docker  # Requires a GitLab runner with docker tag