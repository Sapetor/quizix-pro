# Quizix Pro Docker Compose Configuration
# For deployment on a standalone server (bridge networking, port published).
# For the LAN / host-networking setup, use docker-compose.yml instead.

services:
  quizix-pro:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: quizix-pro:latest
    container_name: quizix-pro-app
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_PATH=/
      # Public URL when fronted by a reverse proxy or tunnel. Without it the QR
      # code and join links fall back to the container's detected IP.
      # - PUBLIC_ORIGIN=https://quiz.example.com
      # Exact CORS allow-list; pair with PUBLIC_ORIGIN or Socket.IO rejects it.
      # - ALLOWED_ORIGINS=https://quiz.example.com
      # Behind a bridge network the client IP is the bridge gateway unless the
      # gateway address is trusted here.
      # - TRUSTED_PROXY_IPS=172.17.0.1
      # Expensive/abusable subsystems off by default; opt in explicitly.
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - MANIM_ENABLED=${MANIM_ENABLED:-false}

    # Port mapping for network access
    ports:
      - "3000:3000"

    # Volume mounts for persistent data
    volumes:
      - quizzes-data:/app/quizzes
      - results-data:/app/results
      - uploads-data:/app/public/uploads

    network_mode: "bridge"

    # Health check configuration
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Named volumes for data persistence
volumes:
  quizzes-data:
    driver: local
  results-data:
    driver: local
  uploads-data:
    driver: local
