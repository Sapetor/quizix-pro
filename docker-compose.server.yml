# Quizix Pro Docker Compose Configuration
# For deployment on a standalone server (bridge networking, port published).
# For the LAN / host-networking setup, use docker-compose.yml instead.

services:
  quizix-pro:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: quizix-pro:latest
    container_name: quizix-pro-app
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_PATH=/
      # Public URL when fronted by a reverse proxy or tunnel. Without it the QR
      # code and join links fall back to the container's detected IP.
      # - PUBLIC_ORIGIN=https://quiz.example.com
      # Exact CORS allow-list; pair with PUBLIC_ORIGIN or Socket.IO rejects it.
      # - ALLOWED_ORIGINS=https://quiz.example.com
      # Behind a bridge network the client IP is the bridge gateway unless the
      # gateway address is trusted here.
      # - TRUSTED_PROXY_IPS=172.17.0.1
      # Expensive/abusable subsystems off by default; opt in explicitly.
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - MANIM_ENABLED=${MANIM_ENABLED:-false}

    # Port mapping for network access
    ports:
      - "3000:3000"

    # Volume mounts for persistent data
    volumes:
      - quizzes-data:/app/quizzes
      - results-data:/app/results
      - uploads-data:/app/public/uploads

    network_mode: "bridge"

    # Isolation hardening, mirrored from docker-compose.yml.
    # The server listens on 3000 (server.js:744), so nothing needs
    # CAP_NET_BIND_SERVICE and dropping ALL capabilities is safe.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The process cap lives in the deploy block below: Compose maps pids_limit
    # and deploy.resources.limits.pids onto the same setting and refuses the
    # file when both are present with different values.
    # No mem_limit/cpus either: docker-compose.yml sets 2g/2 CPUs for the LAN
    # host-network setup, while this file already caps the container at 512M /
    # 0.5 CPU through deploy.resources. Copying mem_limit would collide with
    # that limit rather than add to it. Raise the deploy block, not these keys,
    # if this server runs Manim (MANIM_ENABLED=true) or many concurrent games.

    # Health check configuration
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
          pids: 256
        reservations:
          memory: 256M
          cpus: '0.25'

# Named volumes for data persistence
volumes:
  quizzes-data:
    driver: local
  results-data:
    driver: local
  uploads-data:
    driver: local
